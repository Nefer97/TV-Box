# Riavvio automatico se il Mac mini si blocca del tutto (come il blocco "muto" delle 08:01).
# systemd "accarezza" ogni 15 s il watchdog hardware del chipset (iTCO, ICH7): se il sistema
# è piantato e per 30 s non lo fa più, il chipset riavvia il computer da solo.
# Installato in /etc/systemd/system.conf.d/90-tvbox-watchdog.conf
[Manager]
RuntimeWatchdogSec=30s
# anche lo spegnimento/riavvio non può restare appeso più di 2 minuti
RebootWatchdogSec=2min
