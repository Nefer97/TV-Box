# GMA 950 (i945): driver modesetting senza glamor (accelerazione 2D in software).
# È la configurazione provata sul Mac mini. Chrome sul GMA 950 disegna comunque in software.
# (Il crash di Xorg all'avvio era dovuto al VGA arbiter, risolto con Xorg senza root:
#  vedi Xwrapper.config in install.sh.)
Section "Device"
    Identifier "GMA950"
    Driver     "modesetting"
    Option     "AccelMethod" "none"
    Option     "Monitor-VGA-1" "TV-VGA"
EndSection

# TV di destinazione (Smart Tech, collegata in VGA): non comunica le risoluzioni che accetta
# (EDID vuoto), quindi Linux si fermava a 1024x768 (4:3, immagine sfocata e stirata).
# Provate a mano: 1360x768 la TV la accetta ma la taglia e la sfoca (formato "da PC");
# 1280x720 (formato HD da TV) si vede bene → la usiamo sempre.
Section "Monitor"
    Identifier  "TV-VGA"
    HorizSync   28-70
    VertRefresh 50-75
    Modeline "1360x768"  85.50  1360 1424 1536 1792  768 771 777 795  +hsync +vsync
    Modeline "1280x720"  74.25  1280 1390 1430 1650  720 725 730 750  +hsync +vsync
    Option   "PreferredMode" "1280x720"
EndSection
