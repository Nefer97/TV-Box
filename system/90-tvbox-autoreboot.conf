# Riavvio automatico dopo un errore grave del kernel (invece di restare fermi per sempre).
# Installato in /etc/sysctl.d/90-tvbox-autoreboot.conf
# dopo un "kernel panic" aspetta 10 s (il tempo di mandare i messaggi alla diagnostica) e riavvia
kernel.panic = 10
# un errore interno del kernel ("oops") diventa panic -> riavvio, invece di un sistema mezzo rotto
kernel.panic_on_oops = 1
# processore bloccato per oltre 20 s (soft lockup) o con le interruzioni ferme (hard lockup)
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
