# Il Mac mini 2,1 (2007) ignora il riavvio "ACPI" usato da Linux: resta acceso e fermo finché
# non si preme il pulsante. Il metodo "PCI" (reset dal chipset) funziona (provato).
# Vale per i riavvii normali e per quelli automatici dopo un blocco (kernel.panic).
# Installato in /etc/tmpfiles.d/tvbox-reboot.conf (applicato a ogni avvio).
w /sys/kernel/reboot/type - - - - pci
