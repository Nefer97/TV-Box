<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>tvbox · video</title>
<!-- player.html — il player di tvbox per i flussi dati da un connettore (es. "stream" di un
     episodio in tvbox/mio.py): HLS (.m3u8) con hls.js, oppure un file video (mp4, webm…).
     Lo apre tvd (tv.open_stream): il video sta nella pagina, quindi i tasti del telecomando
     (◄ ► salti, ▲ ▼ volume, OK pausa), il punto salvato e la ripresa funzionano sempre.
     Parametri: src = indirizzo del flusso (http/https), title = titolo (per la finestra). -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100vw; height: 100vh; background: #000; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
         padding: 0 8vw; color: #f1f5f9; font: 600 3.4vh system-ui, sans-serif; text-align: center;
         line-height: 1.5; }
  #err small { display: block; margin-top: 1.5vh; font-weight: 400; font-size: 2.4vh; color: #94a3b8; }
</style>
</head>
<body>
<video id="v" autoplay playsinline></video>
<div id="err"></div>
<script src="vendor/hls.min.js"></script>
<script>
(function () {
  const p = new URLSearchParams(location.search);
  const src = p.get('src') || '';
  const v = document.getElementById('v');
  if (p.get('title')) document.title = p.get('title');

  function fail(msg, why) {
    const e = document.getElementById('err');
    e.textContent = msg;
    if (why) { const s = document.createElement('small'); s.textContent = why; e.appendChild(s); }
    e.style.display = 'flex';
    window.__playerError = msg;
  }
  const back = 'MENU per tornare indietro';

  if (!/^https?:\/\//i.test(src)) return fail('Indirizzo del video non valido', back);

  const hlsWanted = /\.m3u8(\?|#|$)/i.test(src) || p.get('type') === 'hls';
  if (hlsWanted && window.Hls && Hls.isSupported()) {
    const h = new Hls({ enableWorker: true });
    let mediaRetry = 0;
    h.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.MEDIA_ERROR && mediaRetry++ < 2) return h.recoverMediaError();
      h.destroy();
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR)
        fail('Il flusso non risponde', 'Il server non lo trova o non lo lascia leggere a tvbox · ' + back);
      else
        fail('Il video non si può riprodurre', back);
    });
    h.loadSource(src);
    h.attachMedia(v);
    window.__hls = h;
  } else if (hlsWanted && !v.canPlayType('application/vnd.apple.mpegurl')) {
    return fail('Questo televisore non sa riprodurre il flusso', back);
  } else {
    v.src = src;                                   // file video, o HLS nativo
  }
  v.addEventListener('error', () => { if (!window.__hls) fail('Il video non si può riprodurre', back); });
  v.play().catch(() => {});
})();
</script>
</body>
</html>
